    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62D6B3"/><stop offset="1" stop-color="#FFCF70"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
