[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "otravel-agent"
version = "0.2.0"
description = "O!Travel Agent — управляемый агент путешествий"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.5,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "jsonschema==4.23.0",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["otravel*"]

[tool.setuptools.package-data]
otravel = ["static/*.html", "static/*.css", "static/*.js", "data/*.json", "data/UNICODE-CLDR-LICENSE.txt", "data/CLDR-ATTRIBUTION.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
