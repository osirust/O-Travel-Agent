[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegml-one-request"
version = "0.1.0"
description = "Публичный DEMO-каркас команды AegML для трека «О!дин запрос»"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegml = "aegml.__main__:main"

[tool.setuptools.packages.find]
include = ["aegml*"]
